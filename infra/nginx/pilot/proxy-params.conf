# Shared proxy settings for the pilot edge. X-Forwarded-For is set to the TCP peer instead of appended to, so a client cannot spoof
# its address; the API honours these headers only because it is never published directly.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
