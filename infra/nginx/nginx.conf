# Edge reverse proxy for local development / single-host deployment.
#
#   Browser -> Nginx -> /api/*  -> Spring Boot (api:8080)
#                     -> /*     -> Angular    (web:80)
#
# The browser only ever talks to this Nginx; it never sees the api/web
# container hostnames or ports directly.

server {
    listen 80;
    server_name _;

    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://web:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
