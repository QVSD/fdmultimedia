services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # Postgres 18+ images store data under a version-specific subdirectory
      # of /var/lib/postgresql (not /var/lib/postgresql/data as with < 18).
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    ports:
      # Management UI only, for local development visibility.
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-media_platform}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dev_minio_password_change_me}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./apps/api-spring
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://minio:9000}
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-http://localhost:9000}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-media-assets}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-media_platform}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-dev_minio_password_change_me}
      STORAGE_PRESIGNED_UPLOAD_TTL: ${STORAGE_PRESIGNED_UPLOAD_TTL:-15m}
      STORAGE_PRESIGNED_DOWNLOAD_TTL: ${STORAGE_PRESIGNED_DOWNLOAD_TTL:-5m}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_DISPLAY_NAME: ${BOOTSTRAP_ADMIN_DISPLAY_NAME:-}
      BOOTSTRAP_WORKSPACE_NAME: ${BOOTSTRAP_WORKSPACE_NAME:-}
      BOOTSTRAP_WORKSPACE_SLUG: ${BOOTSTRAP_WORKSPACE_SLUG:-}
      BOOTSTRAP_SECOND_USER_EMAIL: ${BOOTSTRAP_SECOND_USER_EMAIL:-}
      BOOTSTRAP_SECOND_USER_PASSWORD: ${BOOTSTRAP_SECOND_USER_PASSWORD:-}
      BOOTSTRAP_SECOND_USER_DISPLAY_NAME: ${BOOTSTRAP_SECOND_USER_DISPLAY_NAME:-}
      BOOTSTRAP_SECOND_USER_ROLE: ${BOOTSTRAP_SECOND_USER_ROLE:-ADMIN}
      BOOTSTRAP_WORKER_CREDENTIAL_ID: ${BOOTSTRAP_WORKER_CREDENTIAL_ID:-}
      BOOTSTRAP_WORKER_CREDENTIAL_NAME: ${BOOTSTRAP_WORKER_CREDENTIAL_NAME:-}
      BOOTSTRAP_WORKER_CREDENTIAL_SECRET: ${BOOTSTRAP_WORKER_CREDENTIAL_SECRET:-}
      WORKER_HEARTBEAT_INTERVAL: ${WORKER_HEARTBEAT_INTERVAL:-10s}
      WORKER_OFFLINE_THRESHOLD: ${WORKER_OFFLINE_THRESHOLD:-30s}
      JOB_LEASE_DURATION: ${JOB_LEASE_DURATION:-30s}
      JOB_DEFAULT_MAX_ATTEMPTS: ${JOB_DEFAULT_MAX_ATTEMPTS:-3}
      JOB_MAX_SYSTEM_TEST_DURATION_MS: ${JOB_MAX_SYSTEM_TEST_DURATION_MS:-10000}
      JOB_MAX_SYSTEM_TEST_MESSAGE_LENGTH: ${JOB_MAX_SYSTEM_TEST_MESSAGE_LENGTH:-200}
      MEDIA_MAX_DOWNLOAD_SIZE_BYTES: ${MEDIA_MAX_DOWNLOAD_SIZE_BYTES:-524288000}
      MEDIA_CONNECT_TIMEOUT: ${MEDIA_CONNECT_TIMEOUT:-10s}
      MEDIA_READ_TIMEOUT: ${MEDIA_READ_TIMEOUT:-30s}
      MEDIA_MAX_REDIRECTS: ${MEDIA_MAX_REDIRECTS:-3}
      APP_TRANSCRIPTION_PROVIDER: ${APP_TRANSCRIPTION_PROVIDER:-LOCAL_WHISPER_CLI}
      APP_TRANSCRIPTION_MODEL: ${APP_TRANSCRIPTION_MODEL:-local}
      SOCIAL_CREDENTIAL_ENCRYPTION_KEY: ${SOCIAL_CREDENTIAL_ENCRYPTION_KEY:-}
      INSTAGRAM_ENABLED: ${INSTAGRAM_ENABLED:-false}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_OAUTH_REDIRECT_URI: ${META_OAUTH_REDIRECT_URI:-}
      META_PUBLIC_BASE_URL: ${META_PUBLIC_BASE_URL:-}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-v25.0}
      PUBLISH_SCHEDULER_ENABLED: ${PUBLISH_SCHEDULER_ENABLED:-true}
      PUBLISH_SCHEDULE_MIN_LEAD_SECONDS: ${PUBLISH_SCHEDULE_MIN_LEAD_SECONDS:-30}
      PUBLISH_SCHEDULE_MAX_DAYS: ${PUBLISH_SCHEDULE_MAX_DAYS:-365}
      PUBLISH_SCHEDULE_DISPATCH_BATCH_SIZE: ${PUBLISH_SCHEDULE_DISPATCH_BATCH_SIZE:-50}
      PUBLISH_SCHEDULE_CALENDAR_MAX_DAYS: ${PUBLISH_SCHEDULE_CALENDAR_MAX_DAYS:-90}
      PUBLISH_SCHEDULE_HISTORY_MAX_RESULTS: ${PUBLISH_SCHEDULE_HISTORY_MAX_RESULTS:-100}
      PUBLISH_SCHEDULER_POLL_MS: ${PUBLISH_SCHEDULER_POLL_MS:-15000}
      PUBLICATION_ANALYTICS_ENABLED: ${PUBLICATION_ANALYTICS_ENABLED:-true}
      PUBLICATION_ANALYTICS_POLL_MS: ${PUBLICATION_ANALYTICS_POLL_MS:-60000}
      PUBLICATION_ANALYTICS_BATCH_SIZE: ${PUBLICATION_ANALYTICS_BATCH_SIZE:-20}
      PUBLICATION_ANALYTICS_CLAIM_LEASE: ${PUBLICATION_ANALYTICS_CLAIM_LEASE:-2m}
      PUBLICATION_ANALYTICS_MANUAL_REFRESH_MINIMUM: ${PUBLICATION_ANALYTICS_MANUAL_REFRESH_MINIMUM:-5m}
      PUBLICATION_ANALYTICS_CADENCE_MINUTES: ${PUBLICATION_ANALYTICS_CADENCE_MINUTES:-15,60,360,1440,4320,10080}
      ROBOT_AUTOMATION_ENABLED: ${ROBOT_AUTOMATION_ENABLED:-true}
      ROBOT_MIN_CADENCE_INTERVAL_HOURS: ${ROBOT_MIN_CADENCE_INTERVAL_HOURS:-1}
      ROBOT_MAX_CADENCE_INTERVAL_HOURS: ${ROBOT_MAX_CADENCE_INTERVAL_HOURS:-168}
      ROBOT_MIN_SCHEDULE_DELAY_MINUTES: ${ROBOT_MIN_SCHEDULE_DELAY_MINUTES:-1}
      ROBOT_MAX_SCHEDULE_DELAY_MINUTES: ${ROBOT_MAX_SCHEDULE_DELAY_MINUTES:-10080}
      ROBOT_MAX_RUNS_PER_DAY_LIMIT: ${ROBOT_MAX_RUNS_PER_DAY_LIMIT:-24}
      ROBOT_MAX_ACTIVE_RUNS_PER_WORKSPACE: ${ROBOT_MAX_ACTIVE_RUNS_PER_WORKSPACE:-5}
      ROBOT_DISPATCH_BATCH_SIZE: ${ROBOT_DISPATCH_BATCH_SIZE:-10}
      ROBOT_RECONCILIATION_BATCH_SIZE: ${ROBOT_RECONCILIATION_BATCH_SIZE:-50}
      ROBOT_SCHEDULER_POLL_MS: ${ROBOT_SCHEDULER_POLL_MS:-15000}
      CONTENT_AI_ENABLED: ${CONTENT_AI_ENABLED:-true}
      CONTENT_AI_PROVIDER: ${CONTENT_AI_PROVIDER:-DETERMINISTIC_TEST}
      CONTENT_AI_MODEL: ${CONTENT_AI_MODEL:-deterministic-v1}
      CONTENT_AI_MAX_HOOK_LENGTH: ${CONTENT_AI_MAX_HOOK_LENGTH:-200}
      CONTENT_AI_MAX_CAPTION_LENGTH: ${CONTENT_AI_MAX_CAPTION_LENGTH:-2200}
      CONTENT_AI_MAX_HASHTAGS: ${CONTENT_AI_MAX_HASHTAGS:-30}
      CONTENT_AI_MAX_HASHTAG_LENGTH: ${CONTENT_AI_MAX_HASHTAG_LENGTH:-50}
      CONTENT_AI_MAX_SHORT_TITLE_LENGTH: ${CONTENT_AI_MAX_SHORT_TITLE_LENGTH:-100}
      CONTENT_AI_MAX_TRANSCRIPT_CONTEXT_CHARACTERS: ${CONTENT_AI_MAX_TRANSCRIPT_CONTEXT_CHARACTERS:-4000}
      CONTENT_AI_MAX_TRANSCRIPT_CONTEXT_SEGMENTS: ${CONTENT_AI_MAX_TRANSCRIPT_CONTEXT_SEGMENTS:-80}
      CONTENT_AI_TRANSCRIPT_CONTEXT_PADDING_MS: ${CONTENT_AI_TRANSCRIPT_CONTEXT_PADDING_MS:-5000}
      CONTENT_AI_MAX_PROMPT_CHARACTERS: ${CONTENT_AI_MAX_PROMPT_CHARACTERS:-20000}
      PERFORMANCE_INSIGHTS_MIN_SAMPLE_SIZE: ${PERFORMANCE_INSIGHTS_MIN_SAMPLE_SIZE:-5}
      PERFORMANCE_INSIGHTS_MIN_COVERAGE: ${PERFORMANCE_INSIGHTS_MIN_COVERAGE:-0.60}
      PERFORMANCE_INSIGHTS_MATERIAL_DIFFERENCE_PERCENT: ${PERFORMANCE_INSIGHTS_MATERIAL_DIFFERENCE_PERCENT:-10}
      EXPERIMENT_ANALYSIS_MIN_SAMPLE_PER_VARIANT: ${EXPERIMENT_ANALYSIS_MIN_SAMPLE_PER_VARIANT:-5}
      EXPERIMENT_DECISION_MIN_COVERAGE: ${EXPERIMENT_DECISION_MIN_COVERAGE:-0.60}
      EXPERIMENT_DECISION_ATTRITION_WARNING_POINTS: ${EXPERIMENT_DECISION_ATTRITION_WARNING_POINTS:-20}
      EXPERIMENT_DECISION_DEVIATION_WARNING_RATE: ${EXPERIMENT_DECISION_DEVIATION_WARNING_RATE:-0.20}
      EXPERIMENT_DECISION_APPLICATION_ENABLED: ${EXPERIMENT_DECISION_APPLICATION_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/api/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build:
      context: ./apps/web-angular
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80"]
      interval: 10s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:alpine
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${NGINX_PORT:-8080}:80"
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  rabbitmq_data:
  minio_data:
