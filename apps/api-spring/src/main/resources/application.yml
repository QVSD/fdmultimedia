spring:
  application:
    name: media-platform-api

  # No profile is activated by default. A profile must be selected explicitly
  # (dev locally, prod in production) so configuration intent is always
  # explicit rather than accidental. See application-dev.yml / application-prod.yml.

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 5000
      initialization-fail-timeout: 0

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate must never auto-generate or
      # auto-alter tables; a mismatch should fail startup, not drift silently.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    fail-on-missing-locations: true

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:/}
    connection-timeout: 5000

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      # Under /api so Nginx's /api/* proxy rule reaches it too; the browser
      # never talks to the backend on any other path.
      base-path: /api/actuator
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true

logging:
  level:
    root: INFO
