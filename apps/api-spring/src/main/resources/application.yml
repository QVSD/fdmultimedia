spring:
  application:
    name: media-platform-api

  # No profile is activated by default. A profile must be selected explicitly
  # (dev locally, prod in production) so configuration intent is always
  # explicit rather than accidental. See application-dev.yml / application-prod.yml.

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 5000
      initialization-fail-timeout: 0

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate must never auto-generate or
      # auto-alter tables; a mismatch should fail startup, not drift silently.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    fail-on-missing-locations: true

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:/}
    connection-timeout: 5000

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax

app:
  workers:
    heartbeat-interval: ${WORKER_HEARTBEAT_INTERVAL:10s}
    offline-threshold: ${WORKER_OFFLINE_THRESHOLD:30s}
  jobs:
    lease-duration: ${JOB_LEASE_DURATION:30s}
    default-max-attempts: ${JOB_DEFAULT_MAX_ATTEMPTS:3}
    max-system-test-duration-ms: ${JOB_MAX_SYSTEM_TEST_DURATION_MS:10000}
    max-system-test-message-length: ${JOB_MAX_SYSTEM_TEST_MESSAGE_LENGTH:200}
  scheduling:
    policy-id: ${SCHEDULING_POLICY_ID:TELEMETRY_AWARE_V1}
    candidate-limit: ${SCHEDULING_CANDIDATE_LIMIT:25}
    telemetry-freshness-window: ${SCHEDULING_TELEMETRY_FRESHNESS_WINDOW:60s}
    starvation-threshold: ${SCHEDULING_STARVATION_THRESHOLD:10m}
    history-window: ${SCHEDULING_HISTORY_WINDOW:7d}
    min-historical-samples: ${SCHEDULING_MIN_HISTORICAL_SAMPLES:3}
    critical-memory-available-ratio: ${SCHEDULING_CRITICAL_MEMORY_AVAILABLE_RATIO:0.05}
    history-reference-execution-ms: ${SCHEDULING_HISTORY_REFERENCE_EXECUTION_MS:60000}
    observability:
      decision-retention-days: ${SCHEDULING_DECISION_RETENTION_DAYS:30}
      cleanup-cron: ${SCHEDULING_DECISION_CLEANUP_CRON:0 17 3 * * *}
  media:
    max-download-size-bytes: ${MEDIA_MAX_DOWNLOAD_SIZE_BYTES:524288000}
    connect-timeout: ${MEDIA_CONNECT_TIMEOUT:10s}
    read-timeout: ${MEDIA_READ_TIMEOUT:30s}
    max-redirects: ${MEDIA_MAX_REDIRECTS:3}
  social-credentials:
    # Base64-encoded 32-byte AES-256 key. Blank by default: TEST-only
    # deployments never need it. Required (and validated at startup) only
    # when Instagram publishing is enabled. Never generated automatically.
    encryption-key: ${SOCIAL_CREDENTIAL_ENCRYPTION_KEY:}
  publishing:
    instagram:
      enabled: ${INSTAGRAM_ENABLED:false}
      app-id: ${META_APP_ID:}
      app-secret: ${META_APP_SECRET:}
      oauth-redirect-uri: ${META_OAUTH_REDIRECT_URI:}
      public-base-url: ${META_PUBLIC_BASE_URL:}
      graph-api-version: ${META_GRAPH_API_VERSION:v25.0}
    schedule:
      enabled: ${PUBLISH_SCHEDULER_ENABLED:true}
      min-lead: ${PUBLISH_SCHEDULE_MIN_LEAD_SECONDS:30}s
      max-horizon-days: ${PUBLISH_SCHEDULE_MAX_DAYS:365}
      dispatch-batch-size: ${PUBLISH_SCHEDULE_DISPATCH_BATCH_SIZE:50}
      calendar-max-days: ${PUBLISH_SCHEDULE_CALENDAR_MAX_DAYS:90}
      history-max-results: ${PUBLISH_SCHEDULE_HISTORY_MAX_RESULTS:100}
      poll-interval-ms: ${PUBLISH_SCHEDULER_POLL_MS:15000}
  robots:
    automation-enabled: ${ROBOT_AUTOMATION_ENABLED:true}
    min-cadence-interval-hours: ${ROBOT_MIN_CADENCE_INTERVAL_HOURS:1}
    max-cadence-interval-hours: ${ROBOT_MAX_CADENCE_INTERVAL_HOURS:168}
    min-schedule-delay-minutes: ${ROBOT_MIN_SCHEDULE_DELAY_MINUTES:1}
    max-schedule-delay-minutes: ${ROBOT_MAX_SCHEDULE_DELAY_MINUTES:10080}
    max-runs-per-day-limit: ${ROBOT_MAX_RUNS_PER_DAY_LIMIT:24}
    max-active-runs-per-workspace: ${ROBOT_MAX_ACTIVE_RUNS_PER_WORKSPACE:5}
    dispatch-batch-size: ${ROBOT_DISPATCH_BATCH_SIZE:10}
    reconciliation-batch-size: ${ROBOT_RECONCILIATION_BATCH_SIZE:50}
    poll-interval-ms: ${ROBOT_SCHEDULER_POLL_MS:15000}
  content-ai:
    enabled: ${CONTENT_AI_ENABLED:true}
    provider: ${CONTENT_AI_PROVIDER:DETERMINISTIC_TEST}
    model: ${CONTENT_AI_MODEL:deterministic-v1}
    max-hook-length: ${CONTENT_AI_MAX_HOOK_LENGTH:200}
    max-caption-length: ${CONTENT_AI_MAX_CAPTION_LENGTH:2200}
    max-hashtags: ${CONTENT_AI_MAX_HASHTAGS:30}
    max-hashtag-length: ${CONTENT_AI_MAX_HASHTAG_LENGTH:50}
    max-short-title-length: ${CONTENT_AI_MAX_SHORT_TITLE_LENGTH:100}
    max-transcript-context-characters: ${CONTENT_AI_MAX_TRANSCRIPT_CONTEXT_CHARACTERS:4000}
    max-transcript-context-segments: ${CONTENT_AI_MAX_TRANSCRIPT_CONTEXT_SEGMENTS:80}
    transcript-context-padding-ms: ${CONTENT_AI_TRANSCRIPT_CONTEXT_PADDING_MS:5000}
    max-prompt-characters: ${CONTENT_AI_MAX_PROMPT_CHARACTERS:20000}
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    public-endpoint: ${STORAGE_PUBLIC_ENDPOINT:${STORAGE_ENDPOINT:http://localhost:9000}}
    region: ${STORAGE_REGION:us-east-1}
    bucket: ${STORAGE_BUCKET:media-assets}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
    presigned-upload-ttl: ${STORAGE_PRESIGNED_UPLOAD_TTL:15m}
    presigned-download-ttl: ${STORAGE_PRESIGNED_DOWNLOAD_TTL:5m}
  bootstrap:
    admin:
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
      display-name: ${BOOTSTRAP_ADMIN_DISPLAY_NAME:}
    workspace:
      name: ${BOOTSTRAP_WORKSPACE_NAME:}
      slug: ${BOOTSTRAP_WORKSPACE_SLUG:}
    second-user:
      email: ${BOOTSTRAP_SECOND_USER_EMAIL:}
      password: ${BOOTSTRAP_SECOND_USER_PASSWORD:}
      display-name: ${BOOTSTRAP_SECOND_USER_DISPLAY_NAME:}
      role: ${BOOTSTRAP_SECOND_USER_ROLE:ADMIN}
    worker-credential:
      id: ${BOOTSTRAP_WORKER_CREDENTIAL_ID:}
      name: ${BOOTSTRAP_WORKER_CREDENTIAL_NAME:}
      secret: ${BOOTSTRAP_WORKER_CREDENTIAL_SECRET:}

management:
  endpoints:
    web:
      # Under /api so Nginx's /api/* proxy rule reaches it too; the browser
      # never talks to the backend on any other path.
      base-path: /api/actuator
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true

logging:
  level:
    root: INFO
