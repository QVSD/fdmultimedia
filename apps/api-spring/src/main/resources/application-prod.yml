# Production / pilot profile (Phase 17R). Activate with SPRING_PROFILES_ACTIVE=prod.
#
# Fail-closed: ProductionConfigurationGuard refuses to start when critical configuration is missing or still a development
# placeholder (it reports variable names, never values). No credential is defaulted here; all of them come from the environment
# or from *_FILE secret mounts. See docs/CONFIGURATION.md.

server:
  # nginx is the only supported edge. It sets X-Forwarded-Proto/-For; the API port must never be published directly.
  forward-headers-strategy: framework
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: never
  servlet:
    session:
      cookie:
        # Forced on regardless of SESSION_COOKIE_SECURE. Browsers also accept Secure cookies on http://localhost.
        secure: true
        http-only: true
        same-site: lax

spring:
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate may only validate it.
      ddl-auto: validate
    show-sql: false

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    org.hibernate.SQL: OFF
    com.fdmultimedia.api: INFO
