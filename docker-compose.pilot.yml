# FDM Multimedia v0.1.0-rc1: production pilot stack.
#
#   cp .env.pilot.example .env.pilot        # fill in every REQUIRED value (nothing here has a development default)
#   docker compose --env-file .env.pilot -f docker-compose.pilot.yml build
#   docker compose --env-file .env.pilot -f docker-compose.pilot.yml up -d
#
# The development stack (docker-compose.yml) is unchanged and independent. This file builds immutable, versioned images
# (fdm/*:${FDM_VERSION}), runs every application container as a non-root user with a read-only root filesystem, mounts no source
# code, publishes only the edge nginx (and MinIO's S3 port on the loopback interface), and refuses to start with missing secrets.
# See docs/CONFIGURATION.md and docs/PILOT_CHECKLIST.md.
name: fdmpilot

x-build-args: &build-args
  APP_BUILD_COMMIT: ${FDM_BUILD_COMMIT:-unknown}
  APP_BUILD_TIME: ${FDM_BUILD_TIME:-unknown}
  APP_VERSION: ${FDM_VERSION:-0.1.0-rc1}

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  rabbitmq:
    image: rabbitmq:4-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12

  minio:
    # Built from the pinned upstream source (infra/minio/Dockerfile): MinIO no longer publishes images to Docker Hub.
    image: fdm/minio:${MINIO_IMAGE_VERSION:-2025-10-15}
    build:
      context: ./infra/minio
    restart: unless-stopped
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio_data:/data
    ports:
      # S3 API on the loopback interface only (loopback evaluation mode and operator tooling). In TLS mode browsers and Workers use
      # the proxied storage origin on PILOT_STORAGE_TLS_PORT instead. The console is not exposed.
      - "127.0.0.1:${PILOT_MINIO_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: fdm/minio:${MINIO_IMAGE_VERSION:-2025-10-15}
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/init.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-media-assets}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?STORAGE_ACCESS_KEY is required}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?STORAGE_SECRET_KEY is required}
    volumes:
      - ./infra/minio/init.sh:/init.sh:ro

  api:
    image: fdm/api:${FDM_VERSION:-0.1.0-rc1}
    build:
      context: ./apps/api-spring
      args: *build-args
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    secrets:
      - owner_password
      - worker_secret
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      APP_PUBLIC_ORIGIN: ${APP_PUBLIC_ORIGIN:?APP_PUBLIC_ORIGIN is required}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_MAX_POOL_SIZE: ${DB_MAX_POOL_SIZE:-12}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_PUBLIC_ENDPOINT: ${PILOT_STORAGE_ORIGIN:?PILOT_STORAGE_ORIGIN is required}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-media-assets}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      SESSION_TIMEOUT: ${SESSION_TIMEOUT:-30m}
      FDM_OWNER_EMAIL: ${FDM_OWNER_EMAIL:-}
      FDM_OWNER_NAME: ${FDM_OWNER_NAME:-}
      FDM_OWNER_PASSWORD_FILE: /run/secrets/owner_password
      FDM_WORKSPACE_NAME: ${FDM_WORKSPACE_NAME:-}
      FDM_WORKSPACE_SLUG: ${FDM_WORKSPACE_SLUG:-}
      FDM_WORKER_CREDENTIAL_ID: ${FDM_WORKER_CREDENTIAL_ID:?FDM_WORKER_CREDENTIAL_ID is required}
      FDM_WORKER_CREDENTIAL_NAME: ${FDM_WORKER_CREDENTIAL_NAME:-pilot-worker}
      FDM_WORKER_CREDENTIAL_SECRET_FILE: /run/secrets/worker_secret
      WORKER_HEARTBEAT_INTERVAL: ${WORKER_HEARTBEAT_INTERVAL:-10s}
      WORKER_OFFLINE_THRESHOLD: ${WORKER_OFFLINE_THRESHOLD:-30s}
      JOB_LEASE_DURATION: ${JOB_LEASE_DURATION:-30s}
      MEDIA_MAX_DOWNLOAD_SIZE_BYTES: ${MEDIA_MAX_DOWNLOAD_SIZE_BYTES:-524288000}
      CONTENT_AI_PROVIDER: ${CONTENT_AI_PROVIDER:-DETERMINISTIC_TEST}
      CONTENT_AI_MODEL: ${CONTENT_AI_MODEL:-deterministic-v1}
      SOCIAL_CREDENTIAL_ENCRYPTION_KEY: ${SOCIAL_CREDENTIAL_ENCRYPTION_KEY:-}
      INSTAGRAM_ENABLED: ${INSTAGRAM_ENABLED:-false}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_OAUTH_REDIRECT_URI: ${META_OAUTH_REDIRECT_URI:-}
      META_PUBLIC_BASE_URL: ${META_PUBLIC_BASE_URL:-}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-v25.0}
      TIKTOK_ENABLED: ${TIKTOK_ENABLED:-false}
      TIKTOK_CLIENT_KEY: ${TIKTOK_CLIENT_KEY:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
      TIKTOK_REDIRECT_URI: ${TIKTOK_REDIRECT_URI:-}
      PUBLISH_SCHEDULER_ENABLED: ${PUBLISH_SCHEDULER_ENABLED:-true}
      PUBLICATION_ANALYTICS_ENABLED: ${PUBLICATION_ANALYTICS_ENABLED:-true}
      ROBOT_AUTOMATION_ENABLED: ${ROBOT_AUTOMATION_ENABLED:-true}
      APP_BUILD_COMMIT: ${FDM_BUILD_COMMIT:-unknown}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/api/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    stop_grace_period: 35s

  web:
    image: fdm/web:${FDM_VERSION:-0.1.0-rc1}
    build:
      context: ./apps/web-angular
      args: *build-args
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    image: fdm/worker:${FDM_VERSION:-0.1.0-rc1}
    build:
      context: ./workers/java-agent
      args: *build-args
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=4g
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    secrets:
      - worker_secret
    environment:
      FDM_API_BASE_URL: http://api:8080/api
      FDM_WORKER_CREDENTIAL_ID: ${FDM_WORKER_CREDENTIAL_ID}
      FDM_WORKER_SECRET_FILE: /run/secrets/worker_secret
      FDM_WORKER_NAME: ${FDM_WORKER_NAME:-pilot-worker}
      FDM_WORKER_HEARTBEAT_SECONDS: 10
      FDM_WORKER_JOB_POLL_SECONDS: ${FDM_WORKER_JOB_POLL_SECONDS:-3}
      WORKER_MAX_ACTIVE_JOBS: ${WORKER_MAX_ACTIVE_JOBS:-1}
      TRANSCRIPTION_MODEL: ${TRANSCRIPTION_MODEL:-base}
      TRANSCRIPTION_TIMEOUT_SECONDS: ${TRANSCRIPTION_TIMEOUT_SECONDS:-1800}
      # Optional AI (Ollama stays outside this stack). Leave blank to run deterministic-only.
      CONTENT_AI_RUNTIME: ${CONTENT_AI_RUNTIME:-}
      CONTENT_AI_ENDPOINT: ${CONTENT_AI_ENDPOINT:-http://host.docker.internal:11434}
      CONTENT_AI_MODEL: ${WORKER_CONTENT_AI_MODEL:-llama3.2:3b}
      SEMANTIC_HIGHLIGHT_RUNTIME: ${SEMANTIC_HIGHLIGHT_RUNTIME:-}
      SEMANTIC_HIGHLIGHT_ENDPOINT: ${CONTENT_AI_ENDPOINT:-http://host.docker.internal:11434}
      WORKER_INSTAGRAM_PUBLISHING_ENABLED: ${WORKER_INSTAGRAM_PUBLISHING_ENABLED:-false}
    extra_hosts:
      # Presigned URLs name the public storage host; inside the container that name must reach the Docker host. Ollama (if used)
      # runs on the host too.
      - "${PILOT_STORAGE_HOST:-storage.localhost}:host-gateway"
      - "host.docker.internal:host-gateway"
    volumes:
      - worker_state:/var/lib/fdm-worker
    depends_on:
      api:
        condition: service_healthy

  nginx:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      # The image renders the mounted *.template files into conf.d at start; that directory is the only other writable path.
      - /etc/nginx/conf.d:mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      APP_PUBLIC_ORIGIN: ${APP_PUBLIC_ORIGIN}
      PILOT_STORAGE_ORIGIN: ${PILOT_STORAGE_ORIGIN}
      # Only these two names are substituted into the templates; nginx variables ($host, $scheme, ...) are left alone.
      NGINX_ENVSUBST_FILTER: "^(APP_PUBLIC_ORIGIN|PILOT_STORAGE_ORIGIN)$$"
    volumes:
      - ./infra/nginx/pilot/pilot-${NGINX_MODE:-tls}.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./infra/nginx/pilot/locations.inc.template:/etc/nginx/templates/locations.inc.template:ro
      - ./infra/nginx/pilot/proxy-params.conf:/etc/nginx/pilot/proxy-params.inc:ro
      - ${PILOT_TLS_DIR:-./secrets/tls}:/etc/nginx/tls:ro
    ports:
      - "${PILOT_HTTP_PORT:-80}:8080"
      - "${PILOT_HTTPS_PORT:-443}:8443"
      - "${PILOT_STORAGE_TLS_PORT:-9443}:9443"
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/api/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 10

secrets:
  owner_password:
    file: ${PILOT_SECRETS_DIR:-./secrets}/owner_password
  worker_secret:
    file: ${PILOT_SECRETS_DIR:-./secrets}/worker_secret

volumes:
  postgres_data:
  rabbitmq_data:
  minio_data:
  worker_state:
